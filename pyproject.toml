[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "craft-paper-reproduction"
version = "0.1.0"
description = "Reproduction of the CRAFT paper protocol"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "openai>=1.40",
    "matplotlib>=3.8",
]

[tool.setuptools.packages.find]
where = ["src"]
