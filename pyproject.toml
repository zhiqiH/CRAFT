[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "craft-debate"
version = "0.1.0"
description = "Generative 3+3+1 partial-observation Debate on the CRAFT benchmark"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "openai>=1.40",
    "matplotlib>=3.8",
]

[tool.setuptools.packages.find]
where = ["src"]
